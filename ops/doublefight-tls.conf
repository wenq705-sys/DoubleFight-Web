server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 150.158.127.128;
    ssl_certificate /etc/letsencrypt/live/150.158.127.128/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/150.158.127.128/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1h;
    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
    location = /ws {
        limit_req zone=handshakes burst=20 nodelay;
        limit_req_status 429;
        limit_conn connections 32;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }
    location / { return 404; }
}
