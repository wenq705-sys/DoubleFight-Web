# Dedicated DoubleFight host. Install as /etc/nginx/nginx.conf.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;
include /usr/share/nginx/modules/*.conf;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format ops '$remote_addr [$time_local] "$request_method $uri" $status $request_time';
    access_log /var/log/nginx/access.log ops;
    limit_req_zone $binary_remote_addr zone=handshakes:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name game.whvwayfare.online;
        location ^~ /.well-known/acme-challenge/ {
            root /var/lib/letsencrypt;
            try_files $uri =404;
        }
        location / { return 308 https://game.whvwayfare.online$request_uri; }
    }
    include /etc/nginx/conf.d/doublefight-tls.conf;
}
