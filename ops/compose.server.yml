name: doublefight
services:
  server:
    image: doublefight-server:${DOUBLEFIGHT_RELEASE:?Set the deployed main commit SHA}
    build:
      context: ..
      dockerfile: Dockerfile.server
    restart: unless-stopped
    init: true
    user: node
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.5
    pids_limit: 128
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/health').then(async r=>{if(!r.ok||!(await r.json()).ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
