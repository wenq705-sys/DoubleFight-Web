<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>月灯玉兔 · 3D预览</title><style>html,body{margin:0;width:100%;height:100%;background:#241d20;color:#ffdfac;font-family:system-ui}body{overflow:hidden}canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}#status{position:fixed;z-index:10;bottom:calc(24px + env(safe-area-inset-bottom));width:100%;text-align:center;font-size:14px;pointer-events:none}#top{position:fixed;z-index:10;top:22px;width:100%;text-align:center;font-size:14px;pointer-events:none}#error{position:fixed;z-index:12;top:40%;left:8%;width:84%;text-align:center;white-space:pre-wrap;font-size:13px;color:#fff}</style><script type="importmap">{"imports":{"three":"./three.module.js"}}</script></head><body><div id="top">等级 4 · 月灯玉兔 · 独立预览 V1</div><div id="status">正在初始化 3D 预览…</div><div id="error"></div><script>window.addEventListener('error',e=>{document.getElementById('error').textContent='页面脚本错误：'+e.message});window.addEventListener('unhandledrejection',e=>{document.getElementById('error').textContent='加载异常：'+String(e.reason)});</script><script type="module">
import * as THREE from 'three';import {GLTFLoader} from './GLTFLoader.js';
const status=document.getElementById('status');status.textContent='正在初始化渲染器…';
let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'default'});}catch(e){document.getElementById('error').textContent='WebGL 初始化失败：'+e.message;throw e}
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.45;document.body.insertBefore(renderer.domElement,document.getElementById('top'));
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.01,100);scene.add(new THREE.HemisphereLight(0xffe6bd,0x5b6689,2.7));for(const [x,y,z,p] of [[-3,5,5,3],[3,2,-4,2]]){const l=new THREE.DirectionalLight(0xffffff,p);l.position.set(x,y,z);scene.add(l)}
let model,drag=false,lastX=0,lastY=0,zoom=1;status.textContent='正在下载玉兔模型…';
new GLTFLoader().load('./moon-lantern-rabbit-v1.glb?v=hero04',g=>{model=g.scene;const box=new THREE.Box3().setFromObject(model),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());model.position.sub(center);model.position.y+=size.y*.05;scene.add(model);const r=Math.max(size.x,size.y,size.z);camera.position.set(r*1.65,r*.95,r*2.65);camera.lookAt(0,0,0);status.textContent='月灯玉兔 V1 · 拖动旋转 · 双指缩放'},p=>{if(p.total)status.textContent='模型下载 '+Math.round(p.loaded/p.total*100)+'%'},e=>{status.textContent='模型加载失败';document.getElementById('error').textContent=String(e)});
const c=renderer.domElement;c.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;c.setPointerCapture(e.pointerId)});c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);c.addEventListener('pointermove',e=>{if(!drag||!model)return;model.rotation.y+=(e.clientX-lastX)*.009;model.rotation.x=Math.max(-.35,Math.min(.35,model.rotation.x+(e.clientY-lastY)*.003));lastX=e.clientX;lastY=e.clientY});let pinch=0;c.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch){zoom=Math.max(.65,Math.min(2.2,zoom*d/pinch));camera.zoom=zoom;camera.updateProjectionMatrix()}pinch=d}else pinch=0},{passive:true});function frame(){requestAnimationFrame(frame);renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
