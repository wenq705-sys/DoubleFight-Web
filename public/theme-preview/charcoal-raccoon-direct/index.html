<script type="module">import * as T from 'three';import {GLTFLoader} from '../collection/GLTFLoader.js';const root=document.getElementById('viewer'),tip=document.getElementById('tip');const ren=new T.WebGLRenderer({alpha:true,antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,1.5));ren.setSize(root.clientWidth,root.clientHeight);ren.outputColorSpace=T.SRGBColorSpace;root.insertBefore(ren.domElement,tip);const scene=new T.Scene(),cam=new T.PerspectiveCamera(35,root.clientWidth/root.clientHeight,.01,100);cam.position.set(2.4,1.1,3.6);cam.lookAt(0,0,0);scene.add(new T.HemisphereLight(0xffe6c7,0x646f89,3.2));const light=new T.DirectionalLight(0xfff2dc,3.5);light.position.set(-3,5,4);scene.add(light);const rim=new T.DirectionalLight(0xffbb75,2);rim.position.set(3,2,-4);scene.add(rim);let obj;new GLTFLoader().load('./raccoon.glb?v=raccoon-direct-1',g=>{obj=g.scene;const bounds=new T.Box3().setFromObject(obj);const size=bounds.getSize(new T.Vector3()),center=bounds.getCenter(new T.Vector3());obj.position.sub(center);obj.scale.setScalar(2/Math.max(size.x,size.y,size.z));scene.add(obj);tip.textContent='单指拖动旋转 · 双指缩放'},undefined,e=>{tip.textContent='模型载入失败：'+e.message});let drag=false,x=0,y=0,pinch=0;const c=ren.domElement;c.onpointerdown=e=>{drag=true;x=e.clientX;y=e.clientY;c.setPointerCapture(e.pointerId)};c.onpointerup=()=>drag=false;c.onpointercancel=()=>drag=false;c.onpointermove=e=>{if(!drag||!obj)return;obj.rotation.y+=(e.clientX-x)*.010;obj.rotation.x=Math.max(-.6,Math.min(.6,obj.rotation.x+(e.clientY-y)*.004));x=e.clientX;y=e.clientY};c.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch){cam.zoom=Math.max(.7,Math.min(2.7,cam.zoom*d/pinch));cam.updateProjectionMatrix()}pinch=d}else pinch=0},{passive:true});function frame(){requestAnimationFrame(frame);ren.render(scene,cam)}frame();addEventListener('resize',()=>{ren.setSize(root.clientWidth,root.clientHeight);cam.aspect=root.clientWidth/root.clientHeight;cam.updateProjectionMatrix()});</script></body></html>
