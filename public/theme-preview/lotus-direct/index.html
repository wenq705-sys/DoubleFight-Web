<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>莲花团子 · 零 Codex 对照样品</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#181e22;color:#f9f3e3;font:15px/1.5 system-ui;max-width:800px;margin:auto}h1{font-size:24px;margin:7px 0}p{color:#b7c6bc}.tag{display:inline-block;border:1px solid #72cda2;color:#9de3b9;border-radius:30px;padding:3px 12px;font-size:12px}.viewer{margin-top:16px;background:radial-gradient(#415a50,#131c1b);border-radius:18px;height:48vh;min-height:330px;position:relative;overflow:hidden}.viewer canvas{touch-action:none;display:block}.tip{position:absolute;bottom:8px;width:100%;text-align:center;font-size:12px;color:#fff;pointer-events:none}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.gallery img{width:100%;background:radial-gradient(#697367,#252c2a);border-radius:12px;display:block}.gallery small{display:block;text-align:center;color:#adbdad}.info{background:#293532;padding:13px;border-radius:14px;margin:15px 0}a{color:#a5dfb9}</style><script type="importmap">{"imports":{"three":"../collection/three.module.js"}}</script></head><body><span class="tag">零 Codex · Blender 原创模型实验</span><h1>2 · 莲花团子</h1><p>这只由当前助手直接编写 Blender 建模脚本制作，未使用 Codex。请拖动旋转查看细节。</p><div class="viewer" id="viewer"><div class="tip" id="tip">加载 3D 模型…</div></div><div class="gallery"><div><img src="./front.png" alt="莲花团子正面"><small>正面渲染</small></div><div><img src="./back.png" alt="莲花团子背面"><small>背面渲染</small></div></div><div class="info">真实 GLB：约 2.09 MB · 86,398 三角面 · 7 种材质<br>这是单独对照样品，尚未替换正式模型。<br><a href="../collection/">返回 11 级模型展厅</a></div><script type="module">import * as T from 'three';import{GLTFLoader}from'../collection/GLTFLoader.js';const root=document.getElementById('viewer'),tip=document.getElementById('tip');let renderer=new T.WebGLRenderer({alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(root.clientWidth,root.clientHeight);renderer.outputColorSpace=T.SRGBColorSpace;root.insertBefore(renderer.domElement,tip);const sc=new T.Scene(),camera=new T.PerspectiveCamera(35,root.clientWidth/root.clientHeight,.01,100);camera.position.set(2.4,1.2,3.5);camera.lookAt(0,0,0);sc.add(new T.HemisphereLight(0xffeed9,0x6f8990,3.3));let sun=new T.DirectionalLight(0xffffff,3.3);sun.position.set(-3,5,4);sc.add(sun);let rim=new T.DirectionalLight(0xffebbd,2);rim.position.set(3,2,-4);sc.add(rim);let o;new GLTFLoader().load('./lotus.glb?v=directlotus1',g=>{o=g.scene;let b=new T.Box3().setFromObject(o),sz=b.getSize(new T.Vector3());o.position.sub(b.getCenter(new T.Vector3()));o.scale.setScalar(1.95/Math.max(sz.x,sz.y,sz.z));sc.add(o);tip.textContent='单指拖动旋转 · 双指缩放'},undefined,e=>{tip.textContent='GLB 加载失败 '+e});let drag=false,px=0,py=0,pinch=0;const c=renderer.domElement;c.onpointerdown=e=>{drag=true;px=e.clientX;py=e.clientY;c.setPointerCapture(e.pointerId)};c.onpointerup=()=>drag=false;c.onpointercancel=()=>drag=false;c.onpointermove=e=>{if(drag&&o){o.rotation.y+=(e.clientX-px)*.010;o.rotation.x=Math.max(-.6,Math.min(.6,o.rotation.x+(e.clientY-py)*.004));px=e.clientX;py=e.clientY}};c.addEventListener('touchmove',e=>{if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch){camera.zoom=Math.max(.7,Math.min(2.8,camera.zoom*d/pinch));camera.updateProjectionMatrix()}pinch=d}else pinch=0},{passive:true});function frame(){requestAnimationFrame(frame);renderer.render(sc,camera)}frame();addEventListener('resize',()=>{renderer.setSize(root.clientWidth,root.clientHeight);camera.aspect=root.clientWidth/root.clientHeight;camera.updateProjectionMatrix()});</script></body></html>
