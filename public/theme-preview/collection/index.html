<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>全等级3D模型</title><style>*{box-sizing:border-box}body{margin:0;background:#1e191c;color:#f5dfba;font-family:system-ui}h3{text-align:center;margin:14px}#view{height:55vh;min-height:300px;position:relative;background:radial-gradient(#4c3935,#211b1e);margin:8px;border-radius:16px;overflow:hidden}canvas{width:100%;height:100%;touch-action:none;display:block}#status{position:absolute;bottom:12px;text-align:center;width:100%;font-size:13px;pointer-events:none}#levels{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:8px}button{background:#32292a;border:1px solid #665448;color:#f4dcb7;border-radius:10px;padding:10px 2px;font-size:12px}button.on{border:2px solid #ffd67c}i{display:block;width:26px;height:26px;border-radius:8px;margin:0 auto 5px}#board{display:none;grid-template-columns:repeat(4,1fr);gap:5px;margin:8px;padding:8px;background:#765743;border-radius:12px;aspect-ratio:1}#board>div{position:relative;background:#bda48b;border-radius:7px;overflow:hidden}#board span{position:absolute;bottom:2px;right:3px;font-size:9px}#switch{display:flex;gap:8px;margin:8px}#switch button{flex:1}</style><script type="importmap">{"imports":{"three":"./three.module.js"}}</script></head><body><h3>夜市江湖 · 11 阶真实 3D 模型</h3><div id="switch"><button id="one" class="on">单独旋转</button><button id="all">4×4 棋盘对比</button></div><div id="view"><div id="status">加载 3D 引擎…</div></div><div id="board"></div><div id="levels"></div><script>onerror=e=>document.getElementById('status').textContent='页面错误：'+e;onunhandledrejection=e=>document.getElementById('status').textContent='异常：'+e.reason;</script><script type="module">
import * as T from 'three';import{GLTFLoader}from'./GLTFLoader.js';const ns=[2,4,8,16,32,64,128,256,512,1024,2048],names=['莲花团子','炭火狸猫','珊瑚玉兔','翡翠醒狮','琉璃锦鲤','紫晶守护','玫瑰花灵','鎏金瑞兽','冰晶幻灵','月华圣灵','赤焰神兽'],cs=['#eac48d','#c86a35','#e65b71','#3dad9a','#3489d8','#8254c7','#c34473','#dbb33e','#46c9d9','#d9e2f1','#d96b35'];const v=document.getElementById('view'),st=document.getElementById('status'),buttons=document.getElementById('levels'),board=document.getElementById('board');let r=new T.WebGLRenderer({antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.setSize(v.clientWidth,v.clientHeight);r.outputColorSpace=T.SRGBColorSpace;v.insertBefore(r.domElement,st);let scene=new T.Scene(),cam=new T.PerspectiveCamera(38,v.clientWidth/v.clientHeight,.01,100);cam.position.set(2,1.2,3.4);cam.lookAt(0,0,0);scene.add(new T.HemisphereLight(0xffeedc,0x668099,3));let sun=new T.DirectionalLight(0xffffff,3);sun.position.set(-3,5,4);scene.add(sun);const loader=new GLTFLoader(),cache=new Map();let active,idx=0,down=false,px=0,py=0,pinch=0;
function get(i){if(!cache.has(i))cache.set(i,new Promise((ok,no)=>loader.load('./models/'+String(ns[i]).padStart(4,'0')+'.glb?v=sculpt32',g=>{let o=g.scene,b=new T.Box3().setFromObject(o),sz=b.getSize(new T.Vector3());o.position.sub(b.getCenter(new T.Vector3()));o.scale.multiplyScalar(1.7/Math.max(sz.x,sz.y,sz.z));ok(o)},undefined,no)));return cache.get(i)}
async function select(i){idx=i;buttons.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('on',j===i));st.textContent='加载 '+names[i];try{let o=await get(i);if(active)scene.remove(active);active=o;scene.add(o);o.rotation.set(0,0,0);cam.zoom=1;cam.updateProjectionMatrix();st.textContent=names[i]+' · 拖动旋转 · 双指缩放'}catch(e){st.textContent='模型加载失败：'+e}}
ns.forEach((n,i)=>{let b=document.createElement('button');b.innerHTML='<i style="background:'+cs[i]+'"></i><b>'+n+'</b><br>'+names[i];b.onclick=()=>select(i);buttons.appendChild(b)});let c=r.domElement;c.onpointerdown=e=>{down=true;px=e.clientX;py=e.clientY;c.setPointerCapture(e.pointerId)};c.onpointerup=()=>down=false;c.onpointercancel=()=>down=false;c.onpointermove=e=>{if(down&&active){active.rotation.y+=(e.clientX-px)*.009;active.rotation.x=Math.max(-.4,Math.min(.4,active.rotation.x+(e.clientY-py)*.003));px=e.clientX;py=e.clientY}};c.addEventListener('touchmove',e=>{if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch){cam.zoom=Math.max(.6,Math.min(2.2,cam.zoom*d/pinch));cam.updateProjectionMatrix()}pinch=d}else pinch=0},{passive:true});function draw(){requestAnimationFrame(draw);r.render(scene,cam)}draw();
document.getElementById('one').onclick=()=>{v.style.display='block';board.style.display='none';document.getElementById('one').classList.add('on');document.getElementById('all').classList.remove('on')};document.getElementById('all').onclick=async()=>{v.style.display='none';board.style.display='grid';document.getElementById('all').classList.add('on');document.getElementById('one').classList.remove('on');if(board.children.length)return;for(let i=0;i<16;i++){let cell=document.createElement('div');board.appendChild(cell);if(i>=11)continue;let cv=document.createElement('canvas');cell.appendChild(cv);let label=document.createElement('span');label.textContent=ns[i];cell.appendChild(label);try{let o=(await get(i)).clone(true),s=new T.Scene();s.add(o);s.add(new T.HemisphereLight(0xffffff,0x64738a,3));let l=new T.DirectionalLight(0xffffff,3);l.position.set(-2,4,3);s.add(l);let ca=new T.PerspectiveCamera(40,1,.01,30);ca.position.set(2,1.3,3.3);ca.lookAt(0,0,0);let rr=new T.WebGLRenderer({canvas:cv,alpha:true,antialias:false});rr.setPixelRatio(1);rr.setSize(110,110,false);rr.outputColorSpace=T.SRGBColorSpace;rr.render(s,ca)}catch(e){cell.textContent='加载失败'}}};addEventListener('resize',()=>{r.setSize(v.clientWidth,v.clientHeight);cam.aspect=v.clientWidth/v.clientHeight;cam.updateProjectionMatrix()});select(0);
</script></body></html>
