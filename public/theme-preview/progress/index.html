<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="120"><title>模型进度</title><style>body{background:#10131e;color:#f4eee5;font:15px system-ui;padding:20px;max-width:680px;margin:auto}h1{font-size:25px}.muted{color:#aab4c7}.box{padding:17px;background:#242c3e;border-radius:14px;margin:16px 0}.bar{height:11px;background:#434c5b;border-radius:20px;overflow:hidden}.fill{height:100%;background:#50d4a6}.item{display:flex;justify-content:space-between;gap:12px;background:#1c2333;border:1px solid #343e51;border-radius:12px;padding:14px;margin:8px 0}.done{color:#5cdbab}.work,.paused,.trial{color:#ffd17b}.todo{color:#aab4c7}a{color:#8fbfff}</style><h1>双数对决 · 3D 制作进度</h1><p class="muted">网页每 2 分钟刷新，电脑约每 5 分钟同步；以真实 Blender/GLB 文件为准。</p><main id="app">读取中…</main><p><a href="../lotus-direct/">查看莲花团子零 Codex 样品 →</a></p><p><a href="../collection/?v=84509f9">打开 3D 展厅 →</a></p><script>fetch('status.json?t='+Date.now()).then(r=>r.json()).then(d=>{let n=d.items.filter(x=>x.status==='done').length;document.getElementById('app').innerHTML='<div class="box"><h2>'+n+'/11 已生成</h2><div class="bar"><div class="fill" style="width:'+(n/11*100)+'%"></div></div><p class="muted">同步时间：'+d.updated+'</p><p class="muted">'+d.note+'</p></div>'+d.items.map(x=>'<div class="item"><span><b>'+x.level+' · '+x.name+'</b><br><small class="muted">'+(x.detail||'')+'</small></span><b class="'+x.status+'">'+({done:'已生成',work:'制作中',paused:'额度暂停',trial:'待验收样品',todo:'待重做'}[x.status])+'</b></div>').join('')}).catch(()=>document.getElementById('app').textContent='读取失败，请刷新');</script></html>
