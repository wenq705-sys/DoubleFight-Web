<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>团子 · 3D模型</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at center,#554035,#18161e 80%);overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#status{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#ffe4b7;font:12px system-ui;pointer-events:none}</style><script type="importmap">{"imports":{"three":"./three.module.js"}}</script></head><body><div id="status">手指拖动旋转 · 双指缩放</div><script type="module">import * as THREE from 'three';import{GLTFLoader}from './GLTFLoader.js';const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.01,100),renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.45;document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffe6bd,0x5b6689,2.7));function light(x,y,z,p){const l=new THREE.DirectionalLight(0xffffff,p);l.position.set(x,y,z);scene.add(l)}light(-3,5,5,3);light(3,2,-4,2);let model,drag=false,lastX=0,lastY=0,zoom=1;new GLTFLoader().load('./model.glb',g=>{model=g.scene;const box=new THREE.Box3().setFromObject(model),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());model.position.sub(center);model.position.y+=size.y*.05;scene.add(model);const radius=Math.max(size.x,size.y,size.z);camera.position.set(radius*1.65,radius*.95,radius*2.65);camera.lookAt(0,0,0);document.querySelector('#status').textContent='真实 GLB 模型 · 拖动旋转 · 双指缩放'},undefined,e=>document.querySelector('#status').textContent='模型加载失败，请刷新');const c=renderer.domElement;c.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;c.setPointerCapture(e.pointerId)});c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointermove',e=>{if(!drag||!model)return;model.rotation.y+=(e.clientX-lastX)*.009;model.rotation.x=Math.max(-.35,Math.min(.35,model.rotation.x+(e.clientY-lastY)*.003));lastX=e.clientX;lastY=e.clientY});c.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.65,Math.min(2.2,zoom+e.deltaY*.001));camera.zoom=zoom;camera.updateProjectionMatrix()},{passive:false});let pinch=0;c.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch){zoom=Math.max(.65,Math.min(2.2,zoom*d/pinch));camera.zoom=zoom;camera.updateProjectionMatrix()}pinch=d}else pinch=0},{passive:true});function frame(){requestAnimationFrame(frame);renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
