<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>棋盘尺寸美术验收</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 22%,#644b45,#211d29 80%);font-family:system-ui;color:#ffe9c4;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}.title{font-size:17px;font-weight:800;margin-bottom:8px}.sub{font-size:11px;opacity:.72;margin-bottom:18px}.board{width:min(94vw,440px);aspect-ratio:1;background:linear-gradient(135deg,#9e6d4b,#684536);border:7px solid #bb885d;border-radius:20px;box-shadow:0 18px 35px #0007,inset 0 2px 5px #fff4;padding:8px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.cell{border-radius:11px;background:#382a2c77;min-width:0;display:grid;place-items:center;overflow:hidden}.tile{width:100%;height:100%;border-radius:10px;background:radial-gradient(circle at 50% 35%,#f5d8a3,#bb855b);box-shadow:inset 0 2px 3px #fff8,0 3px 6px #0005;display:grid;place-items:center}.tile img{width:93%;height:93%;object-fit:contain;filter:drop-shadow(0 3px 3px #33241a70)}.tile.big img{width:98%;height:98%}.bar{display:flex;gap:8px;margin-top:18px;width:min(94vw,440px)}button{flex:1;padding:13px 7px;border-radius:12px;border:1px solid #d9ad78;color:#ffe9c4;background:#6b4537;font-weight:700}.detail{display:none;position:fixed;inset:0;background:radial-gradient(circle,#604538,#15151b 80%);z-index:3;align-items:center;justify-content:center;flex-direction:column}.detail img{width:min(92vw,600px);height:75dvh;object-fit:contain}.detail button{flex:none;min-width:130px}.note{font-size:11px;opacity:.65;text-align:center;max-width:390px;margin-top:14px;line-height:1.6}</style></head><body><div class="title">棋盘实际尺寸 · 美术验收</div><div class="sub">手机 4 × 4 棋盘 / 模型不带数字</div><div class="board" id="board"></div><div class="bar"><button id="single">单模型</button><button id="mixed">密集棋盘</button><button id="zoom">放大查看</button></div><div class="note">当前使用恢复的原始 Blender 团子资产，仅用于检验缩小后的辨识度；不是新版团子铺成品。</div><div class="detail" id="detail"><img src="render.png" alt="模型放大效果"><button id="close">返回棋盘</button></div><script>const b=document.querySelector('#board');function draw(m){b.innerHTML='';for(let i=0;i<16;i++){let c=document.createElement('div');c.className='cell';if(m==='mixed'?[0,1,3,4,6,7,8,10,12,13,15].includes(i):[5,6,9].includes(i)){let t=document.createElement('div');t.className='tile';let img=document.createElement('img');img.src='render.png';img.alt='团子模型';t.append(img);c.append(t)}b.append(c)}}draw('single');document.querySelector('#single').onclick=()=>draw('single');document.querySelector('#mixed').onclick=()=>draw('mixed');document.querySelector('#zoom').onclick=()=>document.querySelector('#detail').style.display='flex';document.querySelector('#close').onclick=()=>document.querySelector('#detail').style.display='none';</script></body></html>
