name: Bug report
description: Report a reproducible defect
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: issue
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Exact steps, device/browser, and screenshots/video if visual.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Device, OS, browser, commit/build URL.
