name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Game server smoke test
        run: |
          HOST=127.0.0.1 node --import tsx server/index.ts > /tmp/doublefight-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true; wait $SERVER_PID || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/health > /tmp/health.json; then
              cat /tmp/health.json
              node scripts/smoke-online.mjs
              exit $?
            fi
            sleep 0.25
          done
          cat /tmp/doublefight-server.log
          exit 1
      - name: Production container and proxy configuration smoke
        env:
          DOUBLEFIGHT_RELEASE: ci
        run: |
          set -euo pipefail
          trap 'docker compose -f ops/compose.server.yml down' EXIT
          bash -n ops/deploy-main.sh ops/reload-nginx.sh
          docker compose -f ops/compose.server.yml config --quiet
          docker compose -f ops/compose.server.yml build
          docker compose -f ops/compose.server.yml up -d --wait --wait-timeout 90
          test "$(docker compose -f ops/compose.server.yml port server 8787)" = "127.0.0.1:8787"
          node scripts/smoke-online.mjs
          # Synthetic CI certificate only; never used on the production host.
          mkdir -p /tmp/ci-cert
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=ci.invalid \
            -keyout /tmp/ci-cert/privkey.pem -out /tmp/ci-cert/fullchain.pem 2>/dev/null
          docker run --rm \
            -v "$PWD/ops/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/ops/doublefight-tls.conf:/etc/nginx/conf.d/doublefight-tls.conf:ro" \
            -v /tmp/ci-cert:/etc/letsencrypt/live/150.158.127.128:ro \
            nginx:1.26 nginx -t
