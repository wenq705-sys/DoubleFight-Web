name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/m2-10-2-douyin-product-shell, feat/m2-12-meta-retention-visual, feat/m2-12-server-authority, feat/m2-13-ui-ux-polish, feat/m2-14-solo-redesign, feat/m2-15-playful-world]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Auth HTTP smoke (mock provider)
        run: npm run smoke:auth
      - name: Build
        run: npm run build
      - name: Build Douyin
        run: npm run build:douyin
      - name: Build Douyin release
        run: npm run build:douyin:release
      - name: Douyin release preflight
        run: npm run preflight:douyin
      - name: Game server smoke test
        run: |
          HOST=127.0.0.1 node --import tsx server/index.ts > /tmp/doublefight-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true; wait $SERVER_PID || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/health > /tmp/health.json; then
              cat /tmp/health.json
              test "$(curl --silent --output /tmp/ready.json --write-out '%{http_code}' http://127.0.0.1:8787/ready)" = "503"
              node -e "const r=require('/tmp/ready.json'); if(r.ready!==false||typeof r.authConfigured!=='boolean'||typeof r.sessionSigningConfigured!=='boolean'||typeof r.dataDirectoryWritable!=='boolean'||r.protocolVersion!==6)process.exit(1)"
              node scripts/smoke-online.mjs
              exit $?
            fi
            sleep 0.25
          done
          cat /tmp/doublefight-server.log
          exit 1
      - name: Production container and proxy configuration smoke
        env:
          DOUBLEFIGHT_RELEASE: ci
        run: |
          set -euo pipefail
          trap 'docker compose -f ops/compose.server.yml down' EXIT
          bash -n ops/deploy-main.sh ops/reload-nginx.sh
          grep -q 'location = /ready' ops/doublefight-tls.conf
          docker compose -f ops/compose.server.yml config --quiet
          docker compose -f ops/compose.server.yml build
          docker compose -f ops/compose.server.yml up -d --wait --wait-timeout 90
          test "$(docker compose -f ops/compose.server.yml port server 8787)" = "127.0.0.1:8787"
          test "$(curl --silent --output /tmp/container-ready.json --write-out '%{http_code}' http://127.0.0.1:8787/ready)" = "503"
          node -e "const r=require('/tmp/container-ready.json'); if(r.ready!==false||r.dataDirectoryWritable!==true||r.protocolVersion!==6)process.exit(1)"
          node scripts/smoke-online.mjs
          # Synthetic CI certificate only; never used on the production host.
          mkdir -p /tmp/ci-cert
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=ci.invalid \
            -keyout /tmp/ci-cert/privkey.pem -out /tmp/ci-cert/fullchain.pem 2>/dev/null
          docker run --rm \
            -v "$PWD/ops/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/ops/doublefight-tls.conf:/etc/nginx/conf.d/doublefight-tls.conf:ro" \
            -v /tmp/ci-cert:/etc/letsencrypt/live/game.whvwayfare.online:ro \
            nginx:1.26 nginx -t
